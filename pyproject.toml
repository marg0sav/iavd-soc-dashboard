[project]
name = "iavd-soc-dashboard"
version = "0.1.0"
description = "SOC incident dashboard built with Taipy"
requires-python = ">=3.12,<3.13"

dependencies = [
    "taipy-gui==4.1.2",
    "pandas>=2.2,<3",
    "pyarrow",
    "Flask==3.1.2",
    "plotly>=5.24,<7",
]

[project.scripts]
# (poetry run soc-dashboard) запускает soc_dashboard.main:main()
soc-dashboard = "soc_dashboard.main:main"

[tool.poetry]
requires-poetry = ">=2.5,<3.0"
packages = [{ include = "soc_dashboard", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
