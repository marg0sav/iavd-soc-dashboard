[project]
name = "iavd-soc-dashboard"
version = "0.1.0"
description = "SOC incident dashboard built with Taipy"
requires-python = ">=3.12,<3.13"

dependencies = [
    "taipy-gui==4.1.2",
    "pandas>=2.2,<3",
    "pyarrow",
    "Flask==3.1.2",
    "plotly>=5.24,<7",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.5,<3.0"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Временно, до перехода на пакет src/soc_dashboard: тесты импортируют код как `src...`,
# а без этой строки pytest не видит корень проекта (ModuleNotFoundError: No module named 'src').
# TODO: поправим этот момент позже.
pythonpath = ["."]
