name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: |
          pipx install "poetry>=2.5,<3.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Add pipx binaries to PATH for GitHub Actions and act.

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install dependencies
        run: |
          poetry env use python3.12
          poetry install

      - name: Run tests
        run: poetry run pytest -v
